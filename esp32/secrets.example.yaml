# Copy this file to secrets.yaml (git-ignored) and fill in your own values.

wifi_ssid: "your-wifi-name"
wifi_password: "your-wifi-password"

# Encrypts Wi-Fi logs and over-the-air updates. Generate with: openssl rand -base64 32
api_encryption_key: "REPLACE_WITH_32_BYTE_BASE64_KEY"

# From Xiaomi-cloud-tokens-extractor (see README.md): the scale's MAC and its BLE KEY.
scale_mac: "AA:BB:CC:DD:EE:FF"
scale_bindkey: "00000000000000000000000000000000"

# Your app's production URL. Not a Vercel preview URL, which is password-protected.
ingest_url: "https://your-app.vercel.app/api/scale"

# Must match SCALE_INGEST_TOKEN in Vercel. Generate with: openssl rand -hex 32
ingest_token: "REPLACE_WITH_A_RANDOM_TOKEN"
