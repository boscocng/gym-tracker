</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0D0D0C; color: #F2F1EC; font-family: 'Barlow', system-ui, sans-serif; overflow: hidden">

<header style="flex: none; padding: 52px 12px 0; display: flex; align-items: center; justify-content: space-between">
<a href="LogEmpty.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #F2F1EC">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
</a>
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #8A8984">Today</span>
<span aria-hidden="true" style="width: 44px"></span>
</header>

<main style="flex: 1; min-height: 0; box-sizing: border-box; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 20px">
<h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 40px; line-height: 1">Not training today</h1>

<section style="background: #171716; border: 1px solid #262624; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div role="img" aria-label="Last 7 days: 4 trained, 1 rest, 2 skipped" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<span style="height: 28px; border-radius: 8px; background: #FF7A1A"></span>
<span style="height: 28px; border-radius: 8px; background: #FF7A1A"></span>
<span style="height: 28px; border-radius: 8px; background: #5B7690"></span>
<span style="height: 28px; border-radius: 8px; background: #FF7A1A"></span>
<span style="height: 28px; box-sizing: border-box; border-radius: 8px; border: 1.5px solid #F2F1EC"></span>
<span style="height: 28px; border-radius: 8px; background: #FF7A1A"></span>
<span style="height: 28px; box-sizing: border-box; border-radius: 8px; border: 1.5px solid #F2F1EC"></span>
</div>
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: #A3A29C"><strong style="color: #F2F1EC; font-weight: 600">4 of the last 7 days trained.</strong> A free rest day needs 6, so today counts as a skip.</p>
</section>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="skip-reason" style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #8A8984">Why are you skipping?</label>
<textarea id="skip-reason" rows="4" style="box-sizing: border-box; width: 100%; padding: 14px 16px; border-radius: 14px; border: 1.5px solid #FF7A1A; background: #171716; color: #F2F1EC; font-family: 'Barlow', sans-serif; font-size: 17px; line-height: 1.4; resize: none">Exam at 9 am and a group project due tonight.</textarea>
<span style="font-size: 13px; color: #8A8984">At least 20 characters. It shows on your calendar.</span>
</div>
</main>

<div style="flex: none; padding: 16px 16px 40px">
<a href="SkipConfirm.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: #FF7A1A; color: #0D0D0C; text-decoration: none; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.04em; text-transform: uppercase">Continue</a>
</div>
</div>
