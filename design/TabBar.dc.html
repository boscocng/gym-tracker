<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Condensed:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Main" style="width: 390px; height: 84px; box-sizing: border-box; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 8px 28px; background: #111110; border-top: 1px solid #232321; font-family: 'Barlow Condensed', sans-serif; color: #8A8984">
<a href="Main.dc.html" aria-current="{{ homeCurrent }}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 50px; text-decoration: none; color: {{ homeColor }}; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5 12 4l8.5 6.5"></path><path d="M5.5 9.5V20h13V9.5"></path><path d="M10 20v-5.5h4V20"></path></svg>
<span>Home</span>
</a>
<a href="Log.dc.html" aria-current="{{ logCurrent }}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 50px; text-decoration: none; color: {{ logColor }}; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"></path></svg>
<span>Log</span>
</a>
<a href="Calendar.dc.html" aria-current="{{ calendarCurrent }}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 50px; text-decoration: none; color: {{ calendarColor }}; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>
<span>Calendar</span>
</a>
<a href="AddOns.dc.html" aria-current="{{ addonsCurrent }}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 50px; text-decoration: none; color: {{ addonsColor }}; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3.5 8.5 4.5-8.5 4.5L3.5 8z"></path><path d="m3.5 12.5 8.5 4.5 8.5-4.5"></path><path d="m3.5 16.5 8.5 4.5 8.5-4.5"></path></svg>
<span>Add-ons</span>
</a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","log","calendar","addons"],"default":"home"},"$preview":{"width":390,"height":84}}'>
class Component extends DCLogic {
renderVals() {
const active = this.props.active ?? 'home';
const on = '#FF7A1A';
const off = '#8A8984';
return {
homeColor: active === 'home' ? on : off,
homeCurrent: active === 'home' ? 'page' : null,
logColor: active === 'log' ? on : off,
logCurrent: active === 'log' ? 'page' : null,
calendarColor: active === 'calendar' ? on : off,
calendarCurrent: active === 'calendar' ? 'page' : null,
addonsColor: active === 'addons' ? on : off,
addonsCurrent: active === 'addons' ? 'page' : null
};
}
}
</script>
</body>
</html>
